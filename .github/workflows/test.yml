name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile CLIs and bundled monitor
        run: >-
          python -m py_compile
          scripts/streamlake_experiments.py
          scripts/eval_monitor.py
          scripts/experiment_manifest.py
          scripts/release_check.py
          assets/eval-monitor/monitor_server.py
          assets/eval-monitor/eval_log_parser.py
      - name: Check portable sanitized checkout
        run: python scripts/release_check.py
